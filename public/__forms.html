<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <!--
      Netlify reads these at deploy time to register the site's forms.
      The React app posts submissions here; keep field names in sync with
      src/lib/forms.ts callers.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="source" />
      <input name="mode" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="organization" />
      <input name="interests" />
      <input name="date" />
      <input name="time" />
      <input name="format" />
      <textarea name="message"></textarea>
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input name="bot-field" />
      <input name="email" type="email" />
    </form>
  </body>
</html>
